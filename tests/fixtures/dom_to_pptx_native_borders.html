<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0} body{background:white}
.suite-page{width:1280px;height:720px;position:relative;background:white;font:16px Arial}
.test-card{position:absolute;width:240px;height:120px;border-radius:12px;background:white;padding:20px}
.test-card span{display:block;color:#222}
</style></head><body><div class="suite-page">
<div class="test-card" style="left:40px;top:40px;border-left:4px solid #6BCF7F"><span>Green card</span></div>
<div class="test-card" style="left:320px;top:40px;border-left:3px solid #FF6B9D"><span>Pink card</span></div>
<div class="test-card" style="left:600px;top:40px;border-left:3px solid #B388FF"><span>Purple card</span></div>
<div class="test-card" style="left:880px;top:40px;border-left:8px solid #4FC3F7;border-radius:0"><span>Square edge</span></div>
<div class="test-card" style="left:40px;top:230px;border-top:4px solid #6BCF7F"><span>Top edge</span></div>
<div class="test-card" style="left:320px;top:230px;border-right:6px solid #FF6B9D"><span>Right edge</span></div>
<div class="test-card" style="left:600px;top:230px;border-bottom:3px solid #B388FF"><span>Bottom edge</span></div>
<div class="test-card" style="left:880px;top:230px;border:3px solid #4FC3F7;border-left:8px solid #FF6B9D;border-top:6px solid #6BCF7F;border-bottom:4px solid #B388FF;border-radius:24px 12px 20px 6px"><span>Four colors</span></div>
<div class="test-card" style="left:40px;top:420px;border-left:3px solid rgba(179,136,255,.6);opacity:.5"><span>Transparent edge</span></div>
<div class="test-card" style="left:320px;top:420px;border-left:4px solid #6BCF7F;transform:rotate(12deg)"><span>Rotated edge</span></div>
<div class="test-card" style="left:600px;top:420px;border-left:4px solid #FF6B9D">Direct card text</div>
<div class="test-card" style="left:880px;top:420px;border-left:4px solid #4FC3F7;border-radius:24px / 16px"><span>Elliptical radius</span></div>
<div class="test-card" style="left:40px;top:580px;border-left:4px solid #6BCF7F;border-radius:20px 0 0 20px"></div>
<div class="test-card" style="left:320px;top:580px;border-left:4px solid #6BCF7F;background:linear-gradient(90deg,#fff,#e8f9ec)"><div>Gradient with child text</div></div>
<div class="test-card" data-background-image="true" style="left:600px;top:580px;border-left:4px solid #FF6B9D;background:linear-gradient(90deg,#fff,#ffe8ef)">Gradient with direct text</div>
</div></body></html>
