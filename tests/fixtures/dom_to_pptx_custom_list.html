<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
.suite-page { position:relative; width:1280px; height:720px; background:#fff6ea; font-family:'Microsoft YaHei',sans-serif; color:#2d2a32; }
.card-left { position:absolute; left:60px; top:160px; width:555px; padding:24px 28px; border:2.5px solid #ff6b9d; border-radius:20px; }
.card-list { list-style:none; display:flex; flex-direction:column; gap:14px; }
.card-list li { font-size:14px; line-height:1.6; padding-left:20px; position:relative; font-weight:500; }
.card-list li::before { content:''; position:absolute; left:0; top:8px; width:8px; height:8px; border-radius:50%; background:#ff6b9d; }
.highlight-badge { display:inline-flex; align-items:center; gap:4px; background:#ffd93d; color:#2d2a32; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.plain { position:absolute; left:760px; top:180px; width:350px; padding-left:30px; font-size:20px; }
.plain li { margin-bottom:10px; }
.plain-ordered { top:330px; }
</style></head><body><div class="suite-page">
<div class="card-left"><ul class="card-list">
<li><span class="highlight-badge">8次</span> 专项培训，覆盖合规与模板</li>
<li>培训录像与文档同步上架，形成持续自学体系</li>
<li>推进多平台贯通，计划包含较长的一项内容用于验证自然换行与粉红色圆点的位置关系</li>
</ul></div>
<ul class="plain"><li>普通项目符号</li><li><strong>保留加粗</strong>与正文</li></ul>
<ol class="plain plain-ordered"><li>有序列表第一项</li><li>有序列表第二项</li></ol>
</div></body></html>
